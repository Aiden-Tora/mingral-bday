<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밍랄아 생일축하해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff6f3; --pink:#ffc7d1; --pink-d:#f08aa0; --ink:#5a3a31; --cream:#fffdf8; --mint:#d9f2e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Gowun Dodum',sans-serif;color:var(--ink);background:var(--bg);
    background-image:radial-gradient(#ffd9e0 1.5px,transparent 1.5px);background-size:22px 22px;
    overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  }
  .page{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .page.on{display:flex;animation:fadein .4s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .jua{font-family:'Jua',sans-serif}
  .btn{
    font-family:'Jua',sans-serif;font-size:1.2rem;color:var(--ink);background:var(--pink);
    border:3px solid var(--ink);border-radius:999px;padding:12px 28px;cursor:pointer;
    box-shadow:0 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.ghost{background:var(--cream)}

  /* P1 */
  #p1 h1{
    font-family:'Jua',sans-serif;font-weight:400;line-height:1.05;
    font-size:clamp(4rem,19vw,12rem);color:var(--pink-d);
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
    text-shadow:0 6px 0 var(--ink);animation:bob 2.4s ease-in-out infinite;
  }
  #p1 h1 span{display:block}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
  #p1 .hint{margin:28px 0 18px;font-size:1rem;opacity:.7}

  /* P2 quiz */
  .card{
    width:min(560px,100%);background:var(--cream);border:3px solid var(--ink);border-radius:28px;
    padding:26px 22px;box-shadow:0 6px 0 var(--ink);text-align:left;
  }
  .badge{display:inline-block;font-family:'Jua',sans-serif;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:.95rem}
  .progress{float:right;font-family:'Jua',sans-serif;opacity:.7;padding-top:4px}
  .q{font-size:1.08rem;line-height:1.55;margin:16px 0 18px;word-break:break-all}
  .q b{font-family:'Jua',sans-serif;font-weight:400;font-size:1.25rem}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    font-family:'Gowun Dodum',sans-serif;font-size:1.05rem;text-align:left;color:var(--ink);
    background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 16px;cursor:pointer;
  }
  .opt:hover{background:#fff0f3}
  .opt:active{background:var(--pink)}
  .opt i{font-style:normal;font-family:'Jua',sans-serif;margin-right:8px;color:var(--pink-d)}

  /* fail */
  #fail img{width:min(340px,80vw);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);background:#fff}
  #fail h2{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(1.9rem,8vw,3rem);margin:22px 0 22px;line-height:1.25}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  /* P3 gallery */
  #p3{justify-content:flex-start;padding:14px 14px 16px;gap:10px}
  #p3 h2{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(1.5rem,6vw,2.4rem);color:var(--pink-d);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;flex:none}
  #p3 .sub{font-size:.9rem;opacity:.7;margin-top:-6px;flex:none}
  .grid{
    flex:1;min-height:0;width:100%;max-width:1100px;display:grid;gap:10px;
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  }
  @media (min-aspect-ratio:4/3){ .grid{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr} }
  .ph{position:relative;min-height:0;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;cursor:zoom-in;box-shadow:0 4px 0 var(--ink)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph:nth-child(odd){transform:rotate(-1deg)} .ph:nth-child(even){transform:rotate(1deg)}

  /* fountain */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;display:none}
  #fx.on{display:block}

  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(60,35,30,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:100%;border-radius:14px;border:3px solid #fff}

  /* click character */
  .pop{position:fixed;width:84px;height:84px;pointer-events:none;z-index:100;transform:translate(-50%,-50%);animation:pop 1s ease forwards}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(-15deg);opacity:0}
    15%{transform:translate(-50%,-50%) scale(1.15) rotate(5deg);opacity:1}
    25%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    85%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}
  }
</style>
</head>
<body>

<section class="page on" id="p1">
  <h1><span>밍랄아</span><span>생일축하해</span></h1>
  <p class="hint">아무 데나 눌러봐</p>
  <button class="btn" data-go="quiz">다음</button>
</section>

<section class="page" id="quiz">
  <div class="card">
    <span class="badge">본인확인</span><span class="progress" id="prog">1 / 2</span>
    <p class="q" id="qtext"></p>
    <div class="opts" id="opts"></div>
  </div>
</section>

  function launch(kind){
    const peak=H*(0.45+Math.random()*0.45);           // 최고 높이
    const vy=-Math.sqrt(2*G()*peak);
    const vx=(Math.random()-0.5)*W*(kind==='img'?0.45:0.7);
    const p={kind,x:W/2+(Math.random()-0.5)*30,y:H+20,vx,vy,rot:Math.random()*6.28,vr:(Math.random()-0.5)*(kind==='img'?2.5:10)};
    if(kind==='img'){ p.img=imgs[(Math.random()*3)|0]; p.size=Math.min(130,Math.max(100,W*0.26)); p.y=H+p.size/2; }
    else { p.w=6+Math.random()*6; p.h=4+Math.random()*6; p.c=COLORS[(Math.random()*COLORS.length)|0]; p.circle=Math.random()<0.3; }
    parts.push(p);
  }
  function tick(t){
    if(!running) return;
    const dt=Math.min((t-last)/1000,0.05); last=t;
    accC+=dt; accI+=dt;
    while(accC>0.03){ launch('c'); accC-=0.03; }   // 컨페티: 초당 약 33개
    while(accI>0.5){ launch('img'); accI-=0.5; }   // 캐릭터: 0.5초마다 1개
    ctx.clearRect(0,0,W,H);
    const g=G();
    parts=parts.filter(p=>{
      p.vy+=g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
      if(p.kind==='c'){ p.vx*=0.995; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if(p.kind==='img'){
        const im=p.img; if(im.complete&&im.naturalWidth){
          const s=p.size/Math.max(im.naturalWidth,im.naturalHeight);
          const w=im.naturalWidth*s,h=im.naturalHeight*s; ctx.drawImage(im,-w/2,-h/2,w,h);
        }
      } else {
        ctx.fillStyle=p.c;
        if(p.circle){ctx.beginPath();ctx.arc(0,0,p.w/2,0,6.28);ctx.fill();}
        else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*1.5))+1);
      }
      ctx.restore();
      return p.y<H+200;
    });
    raf=requestAnimationFrame(tick);
  }
  addEventListener('resize',resize);
  return {
    start(){ if(running) return; resize(); parts=[]; running=true; cv.classList.add('on'); last=performance.now(); raf=requestAnimationFrame(tick); },
    stop(){ running=false; cancelAnimationFrame(raf); cv.classList.remove('on'); parts=[]; ctx.clearRect(0,0,W,H); }
  };
})();
function renderQ(){
  const item = QS[cur];
  document.getElementById('prog').textContent = (cur+1)+' / '+QS.length;
  const qt = document.getElementById('qtext');
  qt.innerHTML = '<b>Q'+(cur+1)+'.</b> ';
  qt.appendChild(document.createTextNode(TITLE + item.q));
  const box = document.getElementById('opts'); box.innerHTML='';
  item.o.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<i>('+(i+1)+')</i>'; b.appendChild(document.createTextNode(t));
    b.onclick=()=>pick(i); box.appendChild(b);
  });
}
function pick(i){
  if(i!==ANS[cur]){ setTimeout(()=>show('fail'),150); return; }
  cur++;
  if(cur>=QS.length) setTimeout(()=>show('p3'),150); else renderQ();
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
document.getElementById('retry').onclick=()=>show('quiz');

// 사진 크게 보기
const lb=document.getElementById('lb');
document.querySelectorAll('.ph img').forEach(img=>img.parentElement.onclick=()=>{lb.querySelector('img').src=img.src;lb.classList.add('on');});
lb.onclick=()=>lb.classList.remove('on');

// 클릭한 자리에 캐릭터 1초
document.addEventListener('pointerdown',e=>{
  const im=document.createElement('img');
  im.src=CHAR; im.className='pop'; im.alt='';
  im.style.left=e.clientX+'px'; im.style.top=e.clientY+'px';
  document.body.appendChild(im);
  setTimeout(()=>im.remove(),1000);
},{passive:true});
</script>
